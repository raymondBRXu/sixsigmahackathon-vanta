  - id: H-11
    title: Add interactive station History diagnosis with eight pattern tests
    points: "Preserves valid QC analysis and makes pattern evidence inspectable"
    status: in_progress
    owner: "Codex with disjoint statistical, interaction and verification subtasks"
    started_at: "2026-10-17"
    owns: ["app/", "tests/", "SPEC.md", "README.md", "docs/plan.md", "CONTRACT.yaml"]
    notes: >
      Explicitly requested after verifying the clean f8b1e48 snapshot.
      Diagnosis defaults off. Enabling it selects and locks all service dates
      until disabled. Test the selected station and operating hour against the
      eight course-image rules using full-series estimated CL and sigma.
      Keep the history chart interactive even with diagnosis off. Hover exposes
      every observed point; detected-rule tabs select all contributing points
      in red and show a short English explanation above the chart.
    definition_of_done: >
      uv run --locked --extra api pytest passes; npm test and npm run build
      in app/frontend pass; browser verifies range locking/unlocking, hover,
      issue switching, station/hour isolation and responsive layout;
      git diff --check passes.
    result: "Implemented and verified: 216 Python tests and 60 frontend tests pass; production build and diff checks pass. Browser confirms full-range lock/unlock, per-issue red points and explanations, point details, hour/station reset and responsive layout. Independent statistical/integration review passed. Updated app runs on localhost port 8000; changes remain uncommitted."

