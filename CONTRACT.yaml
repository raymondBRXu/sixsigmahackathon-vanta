      07:00 and all service dates. Chart-body enlargement remains available.
    definition_of_done: >
      uv run --locked --extra api pytest passes; npm test and npm run build
      in app/frontend pass. Browser checks cover station/hour/date changes,
      date-only axis, limits, full default range and independence from Operations
      playback, realtime 20-chart rendering, fixed reference lines, eight-slot
      rolling updates, rewind, missingness and fixed dimensions. The single-chart
      enlargement, return, keyboard access and ongoing playback pass browser
      checks. History modal checks cover correct station, default hour/full dates,
      independent date analysis, close/Escape/focus, and no obsolete top tabs;
      git diff --check passes.
    result: "Saved in f8b1e48 (react v2), verified clean on 2026-10-17. Frontend has 44 passing tests and a successful build; backend previously passed 152 tests. Browser verified History dialogs, navigation, playback, enlargement and responsive layout."

