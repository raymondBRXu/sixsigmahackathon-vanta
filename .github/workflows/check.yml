name: Verify DockWatch

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install locked environments
        run: |
          python -m pip install uv==0.10.9
          uv sync --frozen --extra api
          npm ci --prefix app/frontend
      - name: Check statistical and API behavior
        env:
          MPLBACKEND: Agg
        run: uv run --frozen --extra api pytest tests data/test_generate_data.py -q
      - name: Check and build React
        run: |
          npm test --prefix app/frontend
          npm run build --prefix app/frontend
      - name: Check packaging
        run: |
          uv build
          uv run --frozen --extra api python scripts/prepare_deploy.py
